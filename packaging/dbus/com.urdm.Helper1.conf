<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root may own the helper name. Any local user may call it; every privileged
     method is authorized individually through polkit (packaging/polkit/com.urdm.policy). -->
<busconfig>
  <policy user="root">
    <allow own="com.urdm.Helper1"/>
    <allow send_destination="com.urdm.Helper1"/>
  </policy>
  <policy context="default">
    <allow send_destination="com.urdm.Helper1" send_interface="com.urdm.Helper1"/>
    <allow send_destination="com.urdm.Helper1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="com.urdm.Helper1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
